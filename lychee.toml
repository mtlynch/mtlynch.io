# External links only. Local HTML/assets use lychee-local.toml instead.
no_progress = true
accept = ["100..=103", "200..=299", "403"]
timeout = 5
max_retries = 1
retry_wait_time = 10
max_concurrency = 4
host_concurrency = 1
host_request_interval = "1s"
method = "get"
# Check the page, not remote fragments (often generated by JavaScript).
include_fragments = "none"
exclude_loopback = true

exclude = [
  # Preserve the lychee branch's exclusions for downloadable/page-bundle assets.
  "\\.(css|js|png|jpe?g|gif|webp|svg|mp4|pdf|txt|xml|ya?ml|nix|lua|py|zst)(\\?.*)?$",
  "Dockerfile\\.(nextcloud|sia)$",
  # Local development-only URLs.
  "^https?://(localhost|raspberrypi)(:|/)",
  # Sites that intermittently block automated requests.
  "//([^.]+\\.)*aliexpress\\.us/",
  "//([^.]+\\.)*amazon\\.com/",
